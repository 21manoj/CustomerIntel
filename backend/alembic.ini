# Alembic — schema migrations for CustomerIntelV1 (backend/migrations/).
#   cd backend && alembic revision --autogenerate -m "what changed"   (DATABASE_URL must point at a DB already at head)
#   alembic upgrade head                                              (the server does this at boot: utils/schema.migrate)
# The URL comes from DATABASE_URL (migrations/env.py); the value below is never used.
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = postgresql://unused

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
