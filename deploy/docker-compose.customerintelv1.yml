# CustomerIntelV1 — its own stack, on either a shared or a dedicated EC2 box.
#
#   cd ~/CustomerIntel/deploy
#   cp .env.customerintelv1.example .env   (fill in secrets)
#   docker compose -p customerintelv1 -f docker-compose.customerintelv1.yml up -d --build
#
# Two deploy topologies, chosen entirely by .env / deploy_ec2.sh — nothing here
# hardcodes either one:
#
#   shared (default)   cspulse-net is EXTERNAL: some other Caddy on the box (not part of
#                       this compose project) joins it and reverse_proxies to
#                       customerintelv1-app:8101 (API/MCP) and customerintelv1-web:8080.
#                       This is the topology the box originally shared with the old
#                       cspulse-platform stack. Default when CADDY_NET_EXTERNAL is unset,
#                       so an old .env with no opinion on this reproduces today's exact
#                       behavior.
#
#   standalone          CADDY_NET_EXTERNAL=false in .env: cspulse-net becomes a plain
#                       network this project creates and owns, and the 'caddy' service
#                       below (profile 'standalone', started only via
#                       `--profile standalone`) is this project's own reverse proxy —
#                       nothing outside this compose file is required. Used for a fresh,
#                       dedicated box with no pre-existing Caddy to plug into.
#
# Host ports are bound to 127.0.0.1 only in both topologies — 80/443 belong to whichever
# Caddy is fronting this box (the shared one, or this project's own 'caddy' service).

name: customerintelv1

services:
  customerintelv1-postgres:
    image: postgres:16
    container_name: customerintelv1-postgres
    restart: unless-stopped
    # max_connections=200 (default 100) -- backend scaling plan step 1. Keep
    # N_web * (DB_POOL_SIZE + DB_MAX_OVERFLOW) + the signal worker + deploy-script
    # connections comfortably under this; the app's own pool sizing is in
    # backend/mcp_server/common.py's get_flask_app(), tunable via DB_POOL_SIZE /
    # DB_MAX_OVERFLOW / DB_POOL_PRE_PING / DB_POOL_RECYCLE below.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_DB: customerintel
      POSTGRES_USER: customerintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - customerintelv1-pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customerintel -d customerintel"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - default

  # One-shot: runs Alembic to head, then exits. Both customerintelv1-app and
  # customerintelv1-worker set MIGRATE_AT_BOOT=false and depend on this
  # completing successfully (backend scaling plan step 3) -- otherwise, once
  # the worker became its own container, two containers could race DDL
  # against a fresh database (migrate() takes no lock of its own). Local/dev
  # `python server.py` or `python worker_main.py` run outside this compose
  # file still self-migrate at boot; MIGRATE_AT_BOOT's default there is
  # unchanged (true).
  customerintelv1-migrate:
    # No build: of its own -- customerintelv1-app (below) is this compose
    # file's only build definition for this image. Three services building
    # the same tag in parallel raced under BuildKit ("image already exists")
    # during local verification; one owner, shared image, is the fix.
    image: customerintelv1-app
    container_name: customerintelv1-migrate
    restart: "no"
    depends_on:
      customerintelv1-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://customerintel:${POSTGRES_PASSWORD}@customerintelv1-postgres:5432/customerintel
    command: ["python", "scripts/run_migrations.py"]
    networks:
      - default

  customerintelv1-app:
    build:
      context: ../backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: customerintelv1-app
    container_name: customerintelv1-app
    restart: unless-stopped
    depends_on:
      customerintelv1-postgres:
        condition: service_healthy
      customerintelv1-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://customerintel:${POSTGRES_PASSWORD}@customerintelv1-postgres:5432/customerintel
      TEST_DATABASE_URL: postgresql://customerintel:${POSTGRES_PASSWORD}@customerintelv1-postgres:5432/customerintel_test
      MCP_TRANSPORT: http
      MCP_AUTH_REQUIRED: ${MCP_AUTH_REQUIRED:-true}
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:?set in .env}
      MCP_ALLOW_QUERY_KEY: ${MCP_ALLOW_QUERY_KEY:-false}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      PORT: "8101"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Signal engine LLM extraction — without the key free text falls to the keyword
      # stub (requires_review). Still needed here even with the worker split out
      # (below): process_now=True calls (submit_signal, research_account_external_signals)
      # and POST /api/signals/process run enrichment synchronously in THIS container.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SIGNAL_ENRICHMENT_MODEL: ${SIGNAL_ENRICHMENT_MODEL:-}
      # customerintelv1-migrate (above) owns schema migration now; the app must
      # not also race it (backend scaling plan step 3).
      MIGRATE_AT_BOOT: "false"
      # The signal worker is customerintelv1-worker's job now, not this
      # container's (backend scaling plan step 3) -- hardcoded, not
      # env-overridable, so a stale SIGNAL_WORKER=true left in .env from
      # before this split can't start a second, redundant in-process worker.
      SIGNAL_WORKER: "false"
      # SQLAlchemy pool sizing (backend scaling plan step 1) -- defaults match
      # backend/mcp_server/common.py's own defaults, so unset works unchanged.
      # Override per-deployment without a code change; keep N_web * (DB_POOL_SIZE +
      # DB_MAX_OVERFLOW) + worker + deploy scripts under POSTGRES_MAX_CONNECTIONS above.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
    ports:
      - "127.0.0.1:8101:8101"
    deploy:
      resources:
        limits:
          memory: 1536m
    networks:
      - default
      - cspulse-net

  # Signal-enrichment worker, its own container (backend scaling plan step 3) --
  # split from customerintelv1-app so `uvicorn asgi:app --workers N` (a future
  # step) can't silently drop it: that CMD never runs server.main(), which is
  # what used to start this as a thread. Single instance only -- process_pending
  # claims work via FOR UPDATE SKIP LOCKED (safe if this were ever scaled, but
  # there's no throughput reason to). Not on cspulse-net: nothing routes to it.
  customerintelv1-worker:
    # No build: of its own -- see customerintelv1-migrate's comment above.
    image: customerintelv1-app
    container_name: customerintelv1-worker
    restart: unless-stopped
    depends_on:
      customerintelv1-postgres:
        condition: service_healthy
      customerintelv1-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://customerintel:${POSTGRES_PASSWORD}@customerintelv1-postgres:5432/customerintel
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SIGNAL_ENRICHMENT_MODEL: ${SIGNAL_ENRICHMENT_MODEL:-}
      MIGRATE_AT_BOOT: "false"   # customerintelv1-migrate owns this; see depends_on above
      SIGNAL_WORKER: ${SIGNAL_WORKER:-true}
      # notify_new_signal() (an in-process threading.Event) can no longer reach
      # this container from the app's ingest calls -- lowered from the code
      # default of 60s so ingest-to-evidence latency stays reasonable.
      SIGNAL_WORKER_POLL_INTERVAL: ${SIGNAL_WORKER_POLL_INTERVAL:-15}
      # Its own small pool -- one process, no concurrent request fan-out like the
      # app has; keep N_web * (DB_POOL_SIZE + DB_MAX_OVERFLOW) + this + deploy
      # scripts comfortably under POSTGRES_MAX_CONNECTIONS (see postgres above).
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-2}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
    command: ["python", "worker_main.py"]
    healthcheck:
      test: ["CMD-SHELL", "python scripts/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - default

  # The browser app: ../frontend is built (npm ci && npm run build) inside its own
  # image and the dist/ served by a small Caddy — see frontend/Dockerfile. No Node
  # on the box, and no static-file serving bolted onto the Python app.
  #
  # Only on cspulse-net: it talks to nothing in this project (Caddy — shared or this
  # project's own, see above — routes the API straight to customerintelv1-app), it just
  # has to be resolvable BY that Caddy. Deliberately no depends_on the app — a static
  # bundle has no boot dependency on the API, and coupling them would let a slow app
  # start hold back the login page.
  customerintelv1-web:
    build:
      context: ../frontend
    image: customerintelv1-web
    container_name: customerintelv1-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8102:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - cspulse-net

  # Standalone mode's own reverse proxy. Absent unless the 'standalone' profile is
  # active — deploy_ec2.sh passes --profile standalone only when DEPLOY_MODE=standalone
  # in .env, and CADDY_NET_EXTERNAL=false alongside it (see the networks: block below).
  # In shared mode this service is never even considered by `docker compose up`; a Caddy
  # outside this project plays this role instead by joining the external cspulse-net.
  #
  # deploy_ec2.sh renders ./caddy/Caddyfile from Caddyfile.standalone.template (the
  # public hostname substituted in) fresh on every deploy — this box's Caddy fronts only
  # this one site, so unlike the shared-mode Caddyfile there is no multi-site file to
  # surgically edit; the whole file is just regenerated.
  caddy:
    image: caddy:2-alpine
    container_name: customerintelv1-caddy
    profiles: ["standalone"]
    restart: unless-stopped
    depends_on:
      - customerintelv1-app
      - customerintelv1-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - customerintelv1-caddy-data:/data
      - customerintelv1-caddy-config:/config
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - cspulse-net

volumes:
  customerintelv1-pgdata:
  customerintelv1-caddy-data:
  customerintelv1-caddy-config:

networks:
  default:
    name: customerintelv1-net
  cspulse-net:
    external: ${CADDY_NET_EXTERNAL:-true}
    name: ${CADDY_NET_NAME:-cspulse_cspulse-net}
