# CustomerIntelV1 — its own stack, on either a shared or a dedicated EC2 box.
#
#   cd ~/CustomerIntel/deploy
#   cp .env.customerintelv1.example .env   (fill in secrets)
#   docker compose -p customerintelv1 -f docker-compose.customerintelv1.yml up -d --build
#
# Two deploy topologies, chosen entirely by .env / deploy_ec2.sh — nothing here
# hardcodes either one:
#
#   shared (default)   cspulse-net is EXTERNAL: some other Caddy on the box (not part of
#                       this compose project) joins it and reverse_proxies to
#                       customerintelv1-app:8101 (API/MCP) and customerintelv1-web:8080.
#                       This is the topology the box originally shared with the old
#                       cspulse-platform stack. Default when CADDY_NET_EXTERNAL is unset,
#                       so an old .env with no opinion on this reproduces today's exact
#                       behavior.
#
#   standalone          CADDY_NET_EXTERNAL=false in .env: cspulse-net becomes a plain
#                       network this project creates and owns, and the 'caddy' service
#                       below (profile 'standalone', started only via
#                       `--profile standalone`) is this project's own reverse proxy —
#                       nothing outside this compose file is required. Used for a fresh,
#                       dedicated box with no pre-existing Caddy to plug into.
#
# Host ports are bound to 127.0.0.1 only in both topologies — 80/443 belong to whichever
# Caddy is fronting this box (the shared one, or this project's own 'caddy' service).

name: customerintelv1

services:
  customerintelv1-postgres:
    image: postgres:16
    container_name: customerintelv1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customerintel
      POSTGRES_USER: customerintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - customerintelv1-pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customerintel -d customerintel"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - default

  customerintelv1-app:
    build:
      context: ../backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: customerintelv1-app
    container_name: customerintelv1-app
    restart: unless-stopped
    depends_on:
      customerintelv1-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://customerintel:${POSTGRES_PASSWORD}@customerintelv1-postgres:5432/customerintel
      TEST_DATABASE_URL: postgresql://customerintel:${POSTGRES_PASSWORD}@customerintelv1-postgres:5432/customerintel_test
      MCP_TRANSPORT: http
      MCP_AUTH_REQUIRED: ${MCP_AUTH_REQUIRED:-true}
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:?set in .env}
      MCP_ALLOW_QUERY_KEY: ${MCP_ALLOW_QUERY_KEY:-false}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      PORT: "8101"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Signal engine LLM extraction — without the key free text falls to the keyword stub (requires_review)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SIGNAL_ENRICHMENT_MODEL: ${SIGNAL_ENRICHMENT_MODEL:-}
      SIGNAL_WORKER: ${SIGNAL_WORKER:-true}
    ports:
      - "127.0.0.1:8101:8101"
    deploy:
      resources:
        limits:
          memory: 1536m
    networks:
      - default
      - cspulse-net

  # The browser app: ../frontend is built (npm ci && npm run build) inside its own
  # image and the dist/ served by a small Caddy — see frontend/Dockerfile. No Node
  # on the box, and no static-file serving bolted onto the Python app.
  #
  # Only on cspulse-net: it talks to nothing in this project (Caddy — shared or this
  # project's own, see above — routes the API straight to customerintelv1-app), it just
  # has to be resolvable BY that Caddy. Deliberately no depends_on the app — a static
  # bundle has no boot dependency on the API, and coupling them would let a slow app
  # start hold back the login page.
  customerintelv1-web:
    build:
      context: ../frontend
    image: customerintelv1-web
    container_name: customerintelv1-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8102:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - cspulse-net

  # Standalone mode's own reverse proxy. Absent unless the 'standalone' profile is
  # active — deploy_ec2.sh passes --profile standalone only when DEPLOY_MODE=standalone
  # in .env, and CADDY_NET_EXTERNAL=false alongside it (see the networks: block below).
  # In shared mode this service is never even considered by `docker compose up`; a Caddy
  # outside this project plays this role instead by joining the external cspulse-net.
  #
  # deploy_ec2.sh renders ./caddy/Caddyfile from Caddyfile.standalone.template (the
  # public hostname substituted in) fresh on every deploy — this box's Caddy fronts only
  # this one site, so unlike the shared-mode Caddyfile there is no multi-site file to
  # surgically edit; the whole file is just regenerated.
  caddy:
    image: caddy:2-alpine
    container_name: customerintelv1-caddy
    profiles: ["standalone"]
    restart: unless-stopped
    depends_on:
      - customerintelv1-app
      - customerintelv1-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - customerintelv1-caddy-data:/data
      - customerintelv1-caddy-config:/config
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - cspulse-net

volumes:
  customerintelv1-pgdata:
  customerintelv1-caddy-data:
  customerintelv1-caddy-config:

networks:
  default:
    name: customerintelv1-net
  cspulse-net:
    external: ${CADDY_NET_EXTERNAL:-true}
    name: ${CADDY_NET_NAME:-cspulse_cspulse-net}
